# Migrations are their own deployable and go first.
#
# Forward-only, and every migration must be compatible with the app versions
# still running while the images roll (expand, then contract in a later
# release). Runs on main whenever the migration set changes, and the app
# deploys wait for it.
name: Deploy database

on:
  push:
    branches: [main]
    paths:
      - packages/db/supabase/migrations/**
      - packages/db/supabase/config.toml
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Push pending migrations
        working-directory: packages/db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push
      - name: Advisors
        working-directory: packages/db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db advisors || true
