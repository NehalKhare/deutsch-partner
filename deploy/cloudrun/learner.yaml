apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dp-learner
  labels:
    cloud.googleapis.com/location: ${GCP_REGION}
    git-sha: ${GIT_SHA}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        git-sha: ${GIT_SHA}
      annotations:
        autoscaling.knative.dev/minScale: "${MIN_INSTANCES}"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 900
      serviceAccountName: dp-learner@${GCP_PROJECT}.iam.gserviceaccount.com
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 30
          env:
            - { name: APP_URL, value: "${APP_URL}" }
            - { name: SEO_INDEXING, value: "${SEO_INDEXING}" }
            - { name: LANGSMITH_TRACING, value: "${LANGSMITH_TRACING}" }
            - { name: LANGSMITH_PROJECT, value: "dp-learner-${ENVIRONMENT}" }
            - name: SUPABASE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: dp-${ENVIRONMENT}-supabase-secret-key, key: latest } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: dp-${ENVIRONMENT}-openrouter-api-key, key: latest } }
            - name: LOG_PSEUDONYM_SALT
              valueFrom: { secretKeyRef: { name: dp-${ENVIRONMENT}-log-pseudonym-salt, key: latest } }
            - name: LANGSMITH_API_KEY
              valueFrom: { secretKeyRef: { name: dp-${ENVIRONMENT}-langsmith-api-key, key: latest } }
  traffic:
    - percent: 100
      latestRevision: true
