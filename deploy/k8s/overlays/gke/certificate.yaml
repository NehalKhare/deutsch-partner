# A Google-managed certificate for the learner hostname. Google issues it once
# DNS for the name points at the static IP, usually within an hour.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: dp-cert
spec:
  domains:
    # Replaced with LEARNER_HOST from site.env.
    - learner.placeholder.invalid
