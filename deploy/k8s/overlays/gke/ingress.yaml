# One Google HTTPS load balancer for the learner app, on a reserved static IP.
# The worker has no route here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dp
  annotations:
    kubernetes.io/ingress.class: gce
    # The name of the IP reserved with `gcloud compute addresses create`.
    # Replaced with STATIC_IP_NAME from site.env.
    kubernetes.io/ingress.global-static-ip-name: dp-ip
    networking.gke.io/managed-certificates: dp-cert
    networking.gke.io/v1beta1.FrontendConfig: dp-frontend
spec:
  defaultBackend:
    service:
      name: learner
      port: { name: http }
  rules:
    # The host is replaced with LEARNER_HOST from site.env.
    - host: learner.placeholder.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: learner
                port: { name: http }
