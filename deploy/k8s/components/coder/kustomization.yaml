# The coding worker: drains the `coder` queue, checks out the repository,
# builds in worktrees and opens pull requests.
#
# Off by default. It needs a GitHub token and costs the most of anything here
# (4 vCPU, 8 GiB). To switch it on, uncomment `components` in the overlay and
# create the coder-secrets Secret; see ../../README.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - worker-coder.yaml

configMapGenerator:
  - name: coder-config
    envs: [coder.env]

# The image, the Supabase URL and the repository come from the overlay's
# site.env, the same values the rest of the overlay uses.
replacements:
  - source: { kind: ConfigMap, name: site, fieldPath: data.WORKER_IMAGE }
    targets:
      - select: { kind: Deployment, name: worker-coder }
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
  - source: { kind: ConfigMap, name: site, fieldPath: data.SUPABASE_URL }
    targets:
      - select: { kind: ConfigMap, name: coder-config }
        fieldPaths:
          - data.NEXT_PUBLIC_SUPABASE_URL
  - source: { kind: ConfigMap, name: site, fieldPath: data.GITHUB_REPOSITORY }
    targets:
      - select: { kind: ConfigMap, name: coder-config }
        fieldPaths:
          - data.GITHUB_REPOSITORY
