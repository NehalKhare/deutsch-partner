# The same image as the queue worker, with the `coder` queue, the repository
# token and the disk a checkout and a `next build` need.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-coder
  labels:
    app.kubernetes.io/name: worker-coder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-coder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-coder
    spec:
      # A build is long. Past this deadline the job is requeued by its lock.
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: dp-worker
          ports:
            - name: health
              containerPort: 8080
          # The queue worker's secrets plus the repository token, which only
          # this Deployment is given.
          envFrom:
            - configMapRef:
                name: coder-config
            - secretRef:
                name: worker-secrets
            - secretRef:
                name: coder-secrets
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            # The clone and the pnpm store.
            - name: workspace
              mountPath: /workspace
            # Worktrees are cut under the system temp directory.
            - name: tmp
              mountPath: /tmp
          # The entrypoint clones and installs before the worker starts.
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
