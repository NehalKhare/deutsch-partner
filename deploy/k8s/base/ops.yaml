# The operator app, on its own hostname with its own sign-in. It never holds a
# model key or a repository token: only ops-config and ops-secrets reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops
  labels:
    app.kubernetes.io/name: ops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ops
          image: dp-ops
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ops-config
            - secretRef:
                name: ops-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ops
  labels:
    app.kubernetes.io/name: ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ops
  ports:
    - name: http
      port: 80
      targetPort: http
