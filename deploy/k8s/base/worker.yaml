# The queue worker: drains the `jobs` queue, serves no traffic, and has no
# Service. The recurring jobs are enqueued by pg_cron in the database, so
# there is no CronJob here. Sized from deploy/cloudrun/worker.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  # One at a time: the old pod drains its jobs before the new one claims.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      # On SIGTERM the loop stops claiming and waits for in-flight jobs. A job
      # still running at the deadline is requeued when its lock expires.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the emptyDir volumes writable by the node user.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: dp-worker
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 3
            failureThreshold: 20
          # 503 once the loop has not polled for a minute.
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 30
            failureThreshold: 3
          # 503 while the last poll failed, e.g. the database is unreachable.
          # Marks the pod unready without restarting it.
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
