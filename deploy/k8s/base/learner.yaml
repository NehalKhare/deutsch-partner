# The learner app: the product learners use. Sized from
# deploy/cloudrun/learner.yaml. Replicas are left to hpa.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learner
  labels:
    app.kubernetes.io/name: learner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: learner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learner
    spec:
      # A trainer turn runs for up to 120 s and the runs feed streams for up
      # to 270 s. This lets most in-flight requests finish on a rollout.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        # The image's `node` user. Kubernetes cannot check a non-numeric user.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: learner
          # Replaced by the overlay with the pushed image.
          image: dp-learner
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: learner-config
            - secretRef:
                name: learner-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            # Keep serving while the load balancer notices the pod is going.
            preStop:
              exec:
                command: ["sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: learner
  labels:
    app.kubernetes.io/name: learner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: learner
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learner
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: learner
